<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>請假與差勤 - Oiia 員工自助服務入口</title>
<link rel="icon" href="oiia.gif" type="image/gif">
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --line: #e1e5ea;
    --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    line-height: 1.7;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
  }
  header .wrap { display: flex; align-items: center; gap: 10px; }
  header a { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; }
  .logo { width: 44px; height: 44px; object-fit: contain; flex: none; }
  header strong { font-size: 18px; }
  .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
  .crumb { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .crumb a { color: var(--accent); text-decoration: none; }
  h1 { font-size: 24px; margin: 8px 0 4px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .notice {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid #f59e0b;
    border-radius: 10px;
    padding: 20px 24px;
  }
  .notice h2 { font-size: 18px; margin: 0 0 8px; }
  .notice p { margin: 0 0 8px; font-size: 15px; }
  .notice ul { margin: 8px 0 0; padding-left: 20px; font-size: 15px; }
  .muted { color: var(--muted); font-size: 14px; }
  footer { color: var(--muted); font-size: 13px; text-align: center; padding: 32px 16px; }
</style>
</head>
<body>
  <header>
    <div class="wrap">
      <a href="./">
        <img class="logo" src="oiia.gif" alt="" width="44" height="44">
        <strong>Oiia 員工自助服務入口</strong>
      </a>
    </div>
  </header>

  <main class="wrap">
    <div class="crumb"><a href="./">首頁</a> › 請假與差勤</div>
    <h1>請假與差勤系統</h1>
    <p class="meta">負責單位：人資部　｜　系統維護：資訊部 應用系統組</p>

    <section class="notice">
      <h2>🛠 系統維護中</h2>
      <p>請假與差勤系統於 <strong>2026/11/24（二）～ 2026/11/27（五）</strong>進行年度版本升級，期間暫停線上服務。</p>
      <ul>
        <li>維護期間如需請假，請先以 Email 告知直屬主管，系統恢復後再補登。</li>
        <li>出勤紀錄不受影響，打卡資料會於系統恢復後自動同步。</li>
        <li>加班申請請於 11/30 前補登完成。</li>
      </ul>
      <p class="muted" style="margin-top:12px">造成不便，敬請見諒。如有疑問請洽人資部（分機 2100）。</p>
    </section>
  </main>

  <footer>© 2026 Oiia Group（虛構示範網站，僅供內部 IT Sharing 使用）</footer>
</body>
</html>
